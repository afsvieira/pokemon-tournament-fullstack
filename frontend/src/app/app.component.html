<!-- Pokemon Tournament Application -->
<div class="container mt-4">
  <!-- Theme Toggle Button -->
  <div class="position-fixed top-0 end-0 p-3" style="z-index: 1000">
    <button 
      class="btn btn-outline-secondary btn-sm rounded-pill"
      (click)="toggleTheme()"
      [title]="isDarkTheme ? 'Switch to Light Theme' : 'Switch to Dark Theme'">
      @if (isDarkTheme) {
        <i class="fas fa-sun me-1"></i>
        Light
      } @else {
        <i class="fas fa-moon me-1"></i>
        Dark
      }
    </button>
  </div>

  <!-- Navigation between the two flows -->
  <nav class="nav nav-pills justify-content-center gap-2 mb-4 app-nav">
    <a class="nav-link" routerLink="/tournament" routerLinkActive="active">
      <i class="fas fa-bolt me-2"></i>
      Instant Simulation
    </a>
    <a class="nav-link" routerLink="/round-by-round" routerLinkActive="active">
      <i class="fas fa-list-ol me-2"></i>
      Round by Round
    </a>
  </nav>

  <router-outlet />
</div>
