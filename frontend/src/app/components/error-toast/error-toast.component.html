<!-- Error Toast Notification - red, top right, hides itself after 5 seconds unless persistent -->
@if (message) {
  <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999">
    <div class="toast show" role="alert">
      <div class="toast-header bg-danger text-white">
        <i class="fas fa-exclamation-triangle me-2"></i>
        <strong class="me-auto">Error</strong>
        <button type="button" class="btn-close btn-close-white" (click)="dismiss()" aria-label="Close"></button>
      </div>
      <div class="toast-body bg-body text-body border border-danger border-top-0">
        {{ message }}
      </div>
    </div>
  </div>
}
